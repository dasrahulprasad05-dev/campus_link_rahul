# Render Blueprint specification for CAMPUSGRID
# https://render.com/docs/blueprint-spec

services:
  # 1. Node.js Backend API + Frontend SPA
  - type: web
    name: campusgrid-web
    runtime: node
    plan: free
    region: singapore
    branch: main
    buildCommand: npm run setup
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: AI_SERVICE_URL
        fromService:
          name: campusgrid-ai
          type: web
          property: host
      - key: SENDGRID_API_KEY
        sync: false
      - key: SENDGRID_FROM_EMAIL
        value: rahulprasadcoding01@gmail.com
      - key: WHATSAPP_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_ID
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        value: campusgrid_verify_2026

  # 2. Python AI Microservice (FastAPI + ML + NLP + Groq LLM + RAG)
  - type: web
    name: campusgrid-ai
    runtime: python
    plan: free
    region: singapore
    branch: main
    rootDir: apps/ai-service
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: GROQ_API_KEY
        sync: false
      - key: ENVIRONMENT
        value: production
